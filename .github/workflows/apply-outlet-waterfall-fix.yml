name: apply-smooth-outlet-waterfall

on:
  push:
    branches:
      - fix/smooth-outlet-waterfall
    paths:
      - scripts/apply_outlet_waterfall_fix.py
      - .github/workflows/apply-outlet-waterfall-fix.yml

permissions:
  contents: write

concurrency:
  group: smooth-outlet-waterfall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted runtime patch
        run: python scripts/apply_outlet_waterfall_fix.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --check

      - name: Commit verified runtime change and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply_outlet_waterfall_fix.py
          rm .github/workflows/apply-outlet-waterfall-fix.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No outlet waterfall changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make outlet waterfall continuous and smooth"
          git push origin "HEAD:${GITHUB_REF_NAME}"
