name: apply-water-quality-tolerance

on:
  push:
    branches:
      - fix/water-camera-pan
    paths:
      - patches/water-quality-tolerance.patch
      - .github/workflows/apply-water-quality-tolerance.yml

permissions:
  contents: write

concurrency:
  group: apply-water-quality-tolerance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused E2E stability patch
        run: |
          set -euxo pipefail
          git apply patches/water-quality-tolerance.patch
          rm patches/water-quality-tolerance.patch
          rm .github/workflows/apply-water-quality-tolerance.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --check

      - name: Commit stabilized comparison
        run: |
          set -euxo pipefail
          git add e2e/water-quality.spec.ts patches .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: stabilize low and high water throughput comparison"
          git push origin HEAD:fix/water-camera-pan
