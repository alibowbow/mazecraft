name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python blender/scripts/test_runtime_atlas.py
      - run: python blender/scripts/validate_runtime_atlas.py public/water-baked
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tested-build
          path: dist/
          retention-days: 1

  browser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: tested-build
          path: dist/
      - run: npx playwright install --with-deps chromium
      # Keep one software-WebGL worker per runner. Separate runners prevent
      # expensive material tests from competing for the same CPU renderer.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --max-failures=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
