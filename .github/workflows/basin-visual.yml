name: Basin visual review

on:
  pull_request:
    paths:
      - 'src/features/waterSimulation/**'
      - 'src/features/waterStudio/**'
      - 'e2e/free-surface-optics.spec.ts'
      - 'e2e/water-garden.spec.ts'
      - '.github/workflows/basin-visual.yml'

permissions:
  contents: read

concurrency:
  group: basin-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: render-${{ matrix.scene }}
    runs-on: ubuntu-latest
    # Optical A/B captures publish independently of the longer app interactions.
    strategy:
      fail-fast: false
      matrix:
        include:
          # deep-basin and cascade-optics were replaced by the authored water
          # gardens (water-garden.spec.ts) when the 3D presets were rebuilt.
          - scene: optics
            specs: e2e/free-surface-optics.spec.ts
            suite: ''
          - scene: app
            specs: e2e/water-garden.spec.ts
            suite: garden
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ matrix.specs }} --workers=1
        env:
          PLAYWRIGHT_SUITE: ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basin-visual-review-${{ matrix.scene }}
          path: test-results/
          retention-days: 7
